<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0c101a"/>
      <stop offset="100%" stop-color="#121624"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- S Primary Neon Gradient (Electric Cyan to Violet/Magenta) -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="40%" stop-color="#00b4d8"/>
      <stop offset="75%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <!-- X Cross Slash Gradient (Vivid Cyan/Purple to Rose/Magenta) -->
    <linearGradient id="xGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="45%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Layered Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Squircle Canvas Base -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="7" y="7" width="498" height="498" rx="111" fill="none" stroke="url(#border)" stroke-width="5"/>

  <!-- Geometric Grid Texture (Subtle developer aesthetic) -->
  <g opacity="0.035" stroke="#ffffff" stroke-width="1.5">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- ShadowmodeX SX Monogram -->
  <g filter="url(#shadow)">
    <!-- X Slash (Chamfered angular cuts matching horizontal terminal lines) -->
    <path d="M 160 392 L 314 136 L 366 136 L 212 392 Z" fill="url(#xGrad)"/>

    <!-- Negative space gap along S stroke for layered interlock depth -->
    <path d="M 372 136
             L 240 136
             C 168 136 128 178 128 238
             C 128 296 180 318 256 318
             L 284 318
             C 328 318 360 334 360 374
             C 360 416 322 444 260 444
             L 128 444"
          fill="none"
          stroke="#07090e"
          stroke-width="74"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- S Primary Flowing Curve -->
    <path d="M 372 136
             L 240 136
             C 168 136 128 178 128 238
             C 128 296 180 318 256 318
             L 284 318
             C 328 318 360 334 360 374
             C 360 416 322 444 260 444
             L 128 444"
          fill="none"
          stroke="url(#sGrad)"
          stroke-width="54"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
